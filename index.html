<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c99486" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="고양이" />
  <meta name="description" content="화면 너머에 사는 고양이. 쓰다듬고, 밥을 주고, 믿음을 쌓아가세요." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>창가의 고양이</title>
  <style>
    :root {
      --paper: #f4eee4;
      --ink: rgba(92, 70, 58, 0.62);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
    }
    #hint {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(28px + env(safe-area-inset-bottom));
      text-align: center;
      font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: 0.02em;
      color: #fff5e8;
      text-shadow: 0 1px 0 rgba(43, 30, 48, 0.75), 0 0 8px rgba(43, 30, 48, 0.45);
      opacity: 0;
      transition: opacity 1.6s ease;
      pointer-events: none;
    }
    #hint.on { opacity: 1; }
    /* the credits card, shown by tapping the little print on the shelf */
    #credits {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(300px, calc(100vw - 48px));
      padding: 18px 18px 16px;
      background: rgba(43, 36, 51, 0.94);
      border: 2px solid #c99486;
      box-shadow: 0 0 0 2px rgba(43, 36, 51, 0.94), 4px 6px 0 rgba(20, 14, 22, 0.35);
      color: #f7f0e8;
      font: 400 12.5px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 5;
    }
    #credits.on { opacity: 1; pointer-events: auto; }
    #credits h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #f6cf9b; letter-spacing: 0.04em; }
    #credits p { margin: 0 0 8px; }
    #credits a { color: #a3b4d4; text-decoration: none; border-bottom: 1px solid rgba(163, 180, 212, 0.4); }
    #credits .small { color: #bdb2c0; font-size: 11.5px; margin: 10px 0 0; }
    noscript, #fallback {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink); text-align: center; padding: 24px;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="방 안의 고양이. 손가락으로 쓰다듬을 수 있어요." role="img"></canvas>
  <div id="hint" aria-live="polite"></div>
  <div id="credits" role="dialog" aria-label="만든 것들"></div>
  <noscript>고양이를 보려면 자바스크립트를 켜 주세요.</noscript>
  <script type="module" src="/src/pixel/main.ts"></script>
</body>
</html>
