<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2433" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="냥아치" />
  <meta name="description" content="집사가 오기 전에 거실을 엉망으로! 고양이가 되어 컵, 꽃병, 화분을 냥냥펀치로 떨어뜨리는 픽셀 아트 액션 게임." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>냥아치</title>
  <style>
    /* the app's words in pixels, as the room is drawn: Galmuri11 (Lee Minseo, SIL OFL 1.1) cut
       down to the letters the app writes (tools/font_subset.py), renamed as its licence asks */
    @font-face {
      font-family: 'Window Pixel';
      src: url('/src/fonts/window-pixel.woff2') format('woff2');
      font-display: block;
    }
    :root {
      --paper: #2b2433;
      --ink: rgba(92, 70, 58, 0.62);
      /* the font's pixel, a whole number of the screen's (main.ts sets it) */
      --fpx: 1px;
      --pixel-font: 'Window Pixel', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #stage.on { opacity: 1; }
    /* while the room is made: the colour of its wall, and a line breathing in and out */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2b2433;
      color: #ffd6a8;
      font: 400 calc(12 * var(--fpx)) / 1.5 var(--pixel-font);
      letter-spacing: 0;
      text-shadow: 0 var(--fpx) 0 rgba(59, 49, 80, 0.45);
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #loading { flex-direction: column; gap: calc(16 * var(--fpx)); }
    /* the cat by its window, as on the icon: 64 art pixels, each a whole number of the screen's */
    #loading img {
      width: calc(192 * var(--fpx));
      height: calc(192 * var(--fpx));
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      animation: arrive 0.9s ease-out both;
    }
    #loading span { animation: breathe 2.6s ease-in-out infinite; }
    @keyframes arrive { from { opacity: 0; transform: translateY(calc(4 * var(--fpx))); } to { opacity: 1; transform: none; } }
    #loading.off { opacity: 0; }
    @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
    noscript, #fallback {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink); text-align: center; padding: 24px;
    }
  </style>
</head>
<body>
  <div id="loading"><img src="./icons/art-64.png" alt="" width="64" height="64" /><span>집사가 나가는 중…</span></div>
  <canvas id="stage" aria-label="거실의 고양이. 물건을 누르면 고양이가 떨어뜨려요." role="img"></canvas>
  <noscript>게임을 하려면 자바스크립트를 켜 주세요.</noscript>
  <script type="module" src="/src/nyang/main.ts"></script>
</body>
</html>
